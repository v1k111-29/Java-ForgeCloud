spring.application.name=mockforge-cloud
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mockforge_cloud?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
server.port=8080
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.data-source-properties.connectTimeout=3000
spring.datasource.hikari.data-source-properties.socketTimeout=3000
server.error.include-stacktrace=never
server.error.include-message=never
mockforge.logging.capacity=500
mockforge.logging.workers=2
mockforge.proxy.allowed-origins=${PROXY_ALLOWED_ORIGINS:}
